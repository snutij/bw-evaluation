repos:
  # ── Ruff lint (check-only, no auto-fix on commit) ────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff

      # ── Ruff format (check-only, fail if files would be reformatted) ─────
      - id: ruff-format
        args: ["--check"]

  # ── Type checking & tests (run from local uv env) ────────────────────────
  # Requires: uv sync --group dev && pre-commit install
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src/bw_evaluation/]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
