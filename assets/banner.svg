<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0e0e0e" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="260" fill="#0a0a0a"/>
  <rect width="960" height="260" fill="url(#grid)"/>

  <!-- ── Score bars (left) ────────────────────────────────────────────── -->
  <!-- 5 dimension bars, bottom-aligned at y=195 -->
  <rect x="60"  y="85"  width="18" height="110" rx="4" fill="#d4d4d4" opacity="0.85"/>
  <rect x="86"  y="55"  width="18" height="140" rx="4" fill="#93c5fd" opacity="0.85"/>
  <rect x="112" y="150" width="18" height="45"  rx="4" fill="#fbbf24" opacity="0.85"/>
  <rect x="138" y="87"  width="18" height="108" rx="4" fill="#86efac" opacity="0.85"/>
  <rect x="164" y="50"  width="18" height="145" rx="4" fill="#f9a8d4" opacity="0.85"/>

  <!-- ── Typography (center) ──────────────────────────────────────────── -->
  <text x="230" y="108" fill="#fff" font-family="'Courier New',monospace" font-size="42" font-weight="bold" letter-spacing="3">bw_evaluation</text>
  <line x1="230" y1="122" x2="490" y2="122" stroke="#1a1a1a" stroke-width="1"/>
  <text x="230" y="142" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="12" letter-spacing="4">SCORE PHOTOS FOR BLACK &amp; WHITE POTENTIAL</text>
  <text x="230" y="168" fill="#1a1a1a" font-family="'Courier New',monospace" font-size="10" letter-spacing="2">DETERMINISTIC · STATISTICAL · NO AI/ML</text>

  <!-- ── Dimension legend (bottom) ────────────────────────────────────── -->
  <line x1="60" y1="218" x2="900" y2="218" stroke="#111" stroke-width="0.5"/>

  <circle cx="230" cy="238" r="3.5" fill="#d4d4d4"/>
  <text   x="240" y="241" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Contrast</text>

  <circle cx="340" cy="238" r="3.5" fill="#93c5fd"/>
  <text   x="350" y="241" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Texture</text>

  <circle cx="440" cy="238" r="3.5" fill="#fbbf24"/>
  <text   x="450" y="241" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Ch.Sep</text>

  <circle cx="535" cy="238" r="3.5" fill="#86efac"/>
  <text   x="545" y="241" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Saturation</text>

  <circle cx="650" cy="238" r="3.5" fill="#f9a8d4"/>
  <text   x="660" y="241" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Composition</text>
</svg>
