<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0e0e0e" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="260" fill="#0a0a0a"/>
  <rect width="960" height="260" fill="url(#grid)"/>

  <!-- ── Score bars (left of center) ──────────────────────────────────── -->
  <!-- 5 dimension bars, bottom-aligned at y=185 -->
  <rect x="248" y="75"  width="18" height="110" rx="4" fill="#d4d4d4" opacity="0.85"/>
  <rect x="274" y="45"  width="18" height="140" rx="4" fill="#93c5fd" opacity="0.85"/>
  <rect x="300" y="140" width="18" height="45"  rx="4" fill="#fbbf24" opacity="0.85"/>
  <rect x="326" y="77"  width="18" height="108" rx="4" fill="#86efac" opacity="0.85"/>
  <rect x="352" y="40"  width="18" height="145" rx="4" fill="#f9a8d4" opacity="0.85"/>

  <!-- ── Typography (right of bars, vertically centered) ──────────────── -->
  <text x="410" y="105" fill="#fff" font-family="'Courier New',monospace" font-size="42" font-weight="bold" letter-spacing="3">bw_evaluation</text>
  <line x1="410" y1="119" x2="670" y2="119" stroke="#1a1a1a" stroke-width="1"/>
  <text x="410" y="139" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="12" letter-spacing="4">SCORE PHOTOS FOR BLACK &amp; WHITE POTENTIAL</text>
  <text x="410" y="165" fill="#1a1a1a" font-family="'Courier New',monospace" font-size="10" letter-spacing="2">DETERMINISTIC · STATISTICAL · NO AI/ML</text>

  <!-- ── Dimension legend (bottom, centered) ──────────────────────────── -->
  <line x1="60" y1="218" x2="900" y2="218" stroke="#111" stroke-width="0.5"/>

  <circle cx="250" cy="240" r="3.5" fill="#d4d4d4"/>
  <text   x="260" y="243" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Contrast</text>

  <circle cx="360" cy="240" r="3.5" fill="#93c5fd"/>
  <text   x="370" y="243" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Texture</text>

  <circle cx="460" cy="240" r="3.5" fill="#fbbf24"/>
  <text   x="470" y="243" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Ch.Sep</text>

  <circle cx="555" cy="240" r="3.5" fill="#86efac"/>
  <text   x="565" y="243" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Saturation</text>

  <circle cx="670" cy="240" r="3.5" fill="#f9a8d4"/>
  <text   x="680" y="243" fill="#2a2a2a" font-family="'Courier New',monospace" font-size="9">Composition</text>
</svg>
