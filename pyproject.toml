[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bw_evaluation"
version = "0.1.0"
description = "Deterministic black & white candidacy measurement and batch-relative ranking"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Justin Rabiller" },
]
keywords = [
    "black-and-white",
    "computer-vision",
    "digital-photography",
    "image-analysis",
    "photography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "Pillow>=10.0",
]

[project.scripts]
bw_evaluation = "bw_evaluation.cli:main"

[project.urls]
Homepage = "https://github.com/snutij/bw-evaluation"
Repository = "https://github.com/snutij/bw-evaluation"
Issues = "https://github.com/snutij/bw-evaluation/issues"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true
